[package]
name = "aisec"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
chrono = "0.4"
rand = "0.8"
goblin = "0.9"
eframe = "0.29"
sysinfo = "0.30"
notify = "6.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"